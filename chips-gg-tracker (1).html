<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chips.gg · Stream Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--gold:#F5C842;--bg:#0E0F11;--surface:#16181C;--surface2:#1E2126;--border:rgba(245,200,66,.12);--border2:rgba(255,255,255,.06);--text:#F0EDE6;--muted:#7A7870;--green:#3DDB82;--red:#FF4D4D}
    html,body{min-height:100%}body{background:radial-gradient(ellipse 60% 40% at 70% 10%,rgba(245,200,66,.06),transparent 70%),var(--bg);font-family:Syne,sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 60px}.page-title{font-size:12px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);font-weight:600;margin-bottom:20px}.tracker{background:var(--surface);border-radius:20px;border:1px solid var(--border);overflow:hidden;width:100%;max-width:900px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
    .header{background:linear-gradient(135deg,#1c1608,#13140f 50%,var(--bg));border-bottom:1px solid var(--border);padding:22px 28px 20px;display:flex;align-items:center;justify-content:space-between}.logo-area{display:flex;align-items:center;gap:12px}.chip-icon{width:36px;height:36px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(245,200,66,.3)}.logo-text{font-size:18px;font-weight:800}.logo-text em{color:var(--gold);font-style:normal}.logo-sub{font-size:11px;color:var(--muted)}.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pill{border-radius:999px;padding:6px 14px;font-family:DM Mono,monospace;font-size:13px;white-space:nowrap}.pill-gold{background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.25);color:var(--gold)}.pill-ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:var(--muted);cursor:pointer;font-family:Syne,sans-serif;font-size:12px;font-weight:700}.pill-ghost:hover,.pill-ghost.active{color:var(--gold);border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.07)}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border2)}.stat-card{padding:18px 22px;border-right:1px solid var(--border2)}.stat-card:last-child{border-right:0}.stat-label,.section-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:7px;font-weight:700}.stat-val{font-family:DM Mono,monospace;font-size:20px}.form-section{padding:20px 28px;border-bottom:1px solid var(--border2);display:grid;grid-template-columns:130px 1fr 120px auto;gap:10px;align-items:end;background:rgba(0,0,0,.15)}.form-notes{padding:0 28px 16px;background:rgba(0,0,0,.15);border-bottom:1px solid var(--border2)}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:7px;font-weight:700}.field input,.field textarea{width:100%;background:var(--surface2);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 13px;color:var(--text);font-family:DM Mono,monospace;font-size:13px;outline:none}.field textarea{resize:none;height:60px;line-height:1.5}.field input:focus,.field textarea:focus{border-color:rgba(245,200,66,.35);box-shadow:0 0 0 3px rgba(245,200,66,.07)}.field input.error{border-color:rgba(255,77,77,.5)}.add-btn{background:var(--gold);color:var(--bg);border:0;border-radius:10px;padding:10px 20px;font-family:Syne,sans-serif;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}.add-btn.cancel{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.12)}.add-btn:disabled{opacity:.4;cursor:not-allowed}.table-wrap{max-height:430px;overflow:auto}table{width:100%;border-collapse:collapse}thead th{background:rgba(0,0,0,.25);font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);padding:10px 14px;text-align:left;position:sticky;top:0;z-index:2}tbody tr{border-bottom:1px solid var(--border2)}tbody tr:hover{background:rgba(255,255,255,.025)}td{padding:13px 14px;font-size:13px;vertical-align:middle}.td-date,.td-cashout,.td-balance{font-family:DM Mono,monospace}.td-date{color:var(--muted);font-size:12px}.td-stream{font-weight:700}.td-stream .dot{display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;margin-right:7px}.td-note{font-size:11px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}.badge.pos{background:rgba(61,219,130,.1);color:var(--green)}.badge.neg{background:rgba(255,77,77,.1);color:var(--red)}.row-btn{background:none;border:0;cursor:pointer;color:var(--muted);font-size:12px;padding:5px 7px;border-radius:7px}.row-btn:hover{color:var(--gold);background:rgba(245,200,66,.08)}.row-btn.delete:hover{color:var(--red);background:rgba(255,77,77,.1)}.empty-state{text-align:center;padding:52px 20px;color:var(--muted)}.footer{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--border2)}.save-ind{font-size:11px;font-family:DM Mono,monospace;color:var(--muted)}.save-ind.ok{color:var(--green)}.save-ind.err{color:var(--red)}.clear-btn{font-size:11px;color:rgba(255,77,77,.5);background:none;border:0;cursor:pointer}.loading{text-align:center;padding:35px}.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(245,200,66,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:650px){body{padding:20px 10px 40px}.header{flex-direction:column;align-items:flex-start;gap:12px}.stats-row{grid-template-columns:repeat(2,1fr)}.stat-card:nth-child(2){border-right:0}.form-section{grid-template-columns:1fr 1fr}.form-section .add-btn{grid-column:1/-1}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}}
  </style>
</head>
<body>
<p class="page-title">Stream Sessions</p>
<div class="tracker">
  <div class="header"><div class="logo-area"><div class="chip-icon">♠</div><div><div class="logo-text"><em>chips</em>.gg</div><div class="logo-sub">stream cashout tracker</div></div></div><div class="header-right"><button class="pill pill-ghost" onclick="exportCSV()">↓ CSV</button><div class="pill pill-gold" id="total-pill">Net +$0.00</div></div></div>
  <div class="stats-row"><div class="stat-card"><div class="stat-label">Streams</div><div class="stat-val" id="s-count">0</div></div><div class="stat-card"><div class="stat-label">Best Session</div><div class="stat-val" id="s-best" style="color:var(--green)">—</div></div><div class="stat-card"><div class="stat-label">Worst Session</div><div class="stat-val" id="s-worst" style="color:var(--red)">—</div></div><div class="stat-card"><div class="stat-label">Average</div><div class="stat-val" id="s-avg" style="color:var(--gold)">—</div></div></div>
  <div class="form-section"><div class="field"><label>Date</label><input type="date" id="f-date"></div><div class="field"><label>Stream Name</label><input type="text" id="f-name" placeholder="e.g. Slots Sunday"></div><div class="field"><label>Cashout ($)</label><input type="number" id="f-cashout" placeholder="0.00" step="0.01"></div><button class="add-btn" id="add-btn" onclick="saveEntry()">+ Add</button><button class="add-btn cancel" id="cancel-btn" onclick="cancelEdit()" style="display:none">Cancel</button></div>
  <div class="form-notes"><div class="field"><label>Notes <span style="opacity:.4;font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label><textarea id="f-note" placeholder="What happened this stream?"></textarea></div></div>
  <div class="table-wrap"><table><thead><tr><th>Date</th><th>Stream</th><th>Cashout</th><th>Balance</th><th>Result</th><th>Note</th><th style="width:105px"></th></tr></thead><tbody id="entries-body"><tr><td colspan="7" class="loading"><span class="spinner"></span></td></tr></tbody></table></div>
  <div class="footer"><div class="save-ind" id="save-ind">Connecting…</div><button class="clear-btn" onclick="clearAll()">Clear all</button></div>
</div>
<script>
const SUPABASE_URL='YOUR_SUPABASE_URL',SUPABASE_KEY='YOUR_SUPABASE_ANON_KEY',API=SUPABASE_URL+'/rest/v1/streams';
const H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
let entries=[],editingId=null;
const $=id=>document.getElementById(id);
function fmt(n){return(n>=0?'+$':'-$')+Math.abs(Number(n)).toFixed(2)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(d){if(!d)return'—';const[y,m,day]=d.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+day)+', '+y}
function status(msg,err=false,ok=false){$('save-ind').textContent=msg;$('save-ind').className='save-ind'+(err?' err':ok?' ok':'')}
async function load(){try{const r=await fetch(API+'?order=date.desc,created_at.desc',{headers:H});if(!r.ok)throw Error();entries=await r.json();render();status(entries.length+' session'+(entries.length!==1?'s':'')+' loaded')}catch(e){status('⚠ Connection failed — check Supabase config',true);$('entries-body').innerHTML='<tr><td colspan="7" class="empty-state">Could not connect to database.</td></tr>'}}
function beginEdit(id){const e=entries.find(x=>String(x.id)===String(id));if(!e)return;editingId=e.id;$('f-date').value=e.date||'';$('f-name').value=e.name||'';$('f-cashout').value=e.cashout??'';$('f-note').value=e.note||'';$('add-btn').textContent='✓ Save changes';$('cancel-btn').style.display='block';$('f-name').focus();status('Editing “'+e.name+'”')}
function cancelEdit(){editingId=null;$('f-date').value=new Date().toISOString().slice(0,10);$('f-name').value='';$('f-cashout').value='';$('f-note').value='';$('add-btn').textContent='+ Add';$('cancel-btn').style.display='none';status('Ready')}
async function saveEntry(){const date=$('f-date').value,name=$('f-name').value.trim(),cashout=parseFloat($('f-cashout').value),note=$('f-note').value.trim();$('f-name').classList.remove('error');$('f-cashout').classList.remove('error');if(!date||!name||Number.isNaN(cashout)){if(!name)$('f-name').classList.add('error');if(Number.isNaN(cashout))$('f-cashout').classList.add('error');return}const btn=$('add-btn');btn.disabled=true;status(editingId?'Updating…':'Saving…');const payload={date,name,cashout};if(note)payload.note=note;try{const url=editingId?API+'?id=eq.'+encodeURIComponent(editingId):API;const r=await fetch(url,{method:editingId?'PATCH':'POST',headers:H,body:JSON.stringify(payload)});if(!r.ok)throw Error(await r.text());const rows=await r.json();if(editingId){const index=entries.findIndex(e=>String(e.id)===String(editingId));if(index>=0)entries[index]=rows[0]||{...entries[index],...payload};cancelEdit();status('✓ Changes saved',false,true)}else{entries.unshift(rows[0]);$('f-name').value='';$('f-cashout').value='';$('f-note').value='';status('✓ Saved',false,true)}render()}catch(e){status(editingId?'⚠ Update failed':'⚠ Save failed',true)}finally{btn.disabled=false;if(!editingId)btn.textContent='+ Add'}}
async function removeEntry(id){if(!confirm('Delete this session?'))return;const old=[...entries];entries=entries.filter(e=>String(e.id)!==String(id));render();try{const r=await fetch(API+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H});if(!r.ok)throw Error();status('Session deleted')}catch(e){entries=old;render();status('⚠ Delete failed',true)}}
async function clearAll(){if(!entries.length||!confirm('Delete all '+entries.length+' session(s)? Cannot be undone.'))return;try{const r=await fetch(API+'?id=in.('+entries.map(e=>e.id).join(',')+')',{method:'DELETE',headers:H});if(!r.ok)throw Error();entries=[];render();status('All sessions cleared')}catch(e){status('⚠ Clear failed',true)}}
function render(){const vals=entries.map(e=>+e.cashout),net=vals.reduce((a,b)=>a+b,0),best=vals.length?Math.max(...vals):null,worst=vals.length?Math.min(...vals):null,avg=vals.length?net/vals.length:null;$('s-count').textContent=entries.length;$('s-best').textContent=best===null?'—':fmt(best);$('s-worst').textContent=worst===null?'—':fmt(worst);$('s-avg').textContent=avg===null?'—':fmt(avg);$('total-pill').textContent='Net '+fmt(net);if(!entries.length){$('entries-body').innerHTML='<tr><td colspan="7" class="empty-state">🎰<br><br>No streams logged yet — add your first session above.</td></tr>';return}let balance=0;$('entries-body').innerHTML=entries.map(e=>{const v=+e.cashout,pos=v>=0;balance+=v;return '<tr><td class="td-date">'+fmtDate(e.date)+'</td><td class="td-stream"><span class="dot"></span>'+esc(e.name)+'</td><td class="td-cashout" style="color:'+(pos?'var(--green)':'var(--red)')+'">'+fmt(v)+'</td><td class="td-balance" style="color:'+(balance>=0?'var(--green)':'var(--red)')+'">'+fmt(balance)+'</td><td><span class="badge '+(pos?'pos':'neg')+'">'+(pos?'▲ profit':'▼ loss')+'</span></td><td class="td-note">'+(e.note?'📝 '+esc(e.note):'—')+'</td><td><button class="row-btn" onclick="beginEdit('+JSON.stringify(e.id)+')">✎ Edit</button><button class="row-btn delete" onclick="removeEntry('+JSON.stringify(e.id)+')">✕</button></td></tr>'}).join('')}
function exportCSV(){if(!entries.length)return;let balance=0;const rows=[['Date','Stream','Cashout','Balance','Result','Note'],...entries.map(e=>{balance+=+e.cashout;return[e.date,e.name,(+e.cashout).toFixed(2),balance.toFixed(2),+e.cashout>=0?'profit':'loss',e.note||'']})];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='chips-gg-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
$('f-date').value=new Date().toISOString().slice(0,10);['f-name','f-cashout'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')saveEntry()}));load();
</script>
</body>
</html>
